services:
  agent:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8000"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  redis_data:
